# Recall production stack.
#
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production up -d --build
#
# Caddy terminates TLS and serves the static dashboard; the server container is
# not published to the host. SQLite lives on the `recall_data` volume.
#
# Proxy trust (R3-03): the stack's network has a fixed subnet and Caddy a fixed
# address, and the app trusts X-Forwarded-For from that one address only
# (TRUST_PROXY is set below from the same variable, so they cannot drift).
# If the subnet clashes with another network on the host, set RECALL_SUBNET and
# RECALL_PROXY_IP (an address inside it) in .env.production.
name: recall

services:
  # Applies pending migrations once, before the server starts. If this fails the
  # app is not started. Re-run it after every image upgrade.
  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "db:deploy"]
    user: "1000:1000"
    environment:
      DATABASE_URL: file:/data/recall.db
    volumes:
      - recall_data:/data
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    env_file:
      - .env.production
    environment:
      DATABASE_URL: file:/data/recall.db
      # Trust forwarded client addresses from Caddy only. Overrides any
      # TRUST_PROXY in .env.production.
      TRUST_PROXY: ${RECALL_PROXY_IP:-172.31.250.10}
    volumes:
      - recall_data:/data
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 4000) + '/api/health/scheduler').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    build:
      context: .
      target: web
    depends_on:
      app:
        condition: service_healthy
    environment:
      RECALL_DOMAIN: ${RECALL_DOMAIN:?set RECALL_DOMAIN in .env.production}
    networks:
      default:
        # The one address the app trusts for X-Forwarded-For.
        ipv4_address: ${RECALL_PROXY_IP:-172.31.250.10}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # One-shot backup runner with the host's ./backups directory mounted. Run with:
  #   docker compose --env-file .env.production --profile backup run --rm backup
  backup:
    profiles: ["backup"]
    build:
      context: .
      target: runtime
    env_file:
      - .env.production
    environment:
      DATABASE_URL: file:/data/recall.db
    user: "${RECALL_UID:-1000}:${RECALL_GID:-1000}"
    volumes:
      - recall_data:/data
      - ./backups:/backups
    command: ["node", "dist/cli.js", "backup", "--out", "/backups", "--keep", "14"]
    restart: "no"

networks:
  default:
    ipam:
      config:
        - subnet: ${RECALL_SUBNET:-172.31.250.0/24}

volumes:
  recall_data:
  caddy_data:
  caddy_config:
